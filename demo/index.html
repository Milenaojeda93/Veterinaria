<div class="login" id="login" hidden><form class="lcard" id="lf" autocomplete="on"><div class="wm big" aria-label="MoledaVet"><span class="paw" aria-hidden="true"></span>Moleda<b>Vet</b></div><h1>Gestión veterinaria</h1><p class="note">Ingresá con tu usuario para entrar al sistema.</p>

</div>
