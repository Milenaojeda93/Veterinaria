<title>MoledaVet Gestión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Clinic back-office: grouped sidebar + work area; MoledaVet greens, orange only for what needs action, red for holidays/alerts. */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --surface-2:#F7FAF3; --line:#E0E8DA;
  --ink:#12352B; --muted:#4A6359; --brand:#0E5A43; --brand-ink:#FFFFFF; --lime:#8CC63F; --lime-soft:#E8F3DC;
  --warn:#B4500F; --warn-soft:#FFF1E6; --bad:#A32019; --bad-soft:#FCE9E7; --info:#285E79; --info-soft:#E4EFF5;
  --side:#0B4A37; --side-ink:#DCEBE3; --wa:#1F7A4D; --bar2:#8A9A92; --shadow:0 10px 26px rgba(14,90,67,.12);
  --f-ui:'Nunito',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A16; --surface:#16241F; --surface-2:#1B2C26; --line:#2A3D35;
  --ink:#E6F0EA; --muted:#A3B8AE; --brand:#4FB287; --brand-ink:#0B1F17; --lime:#9BD458; --lime-soft:#22362A;
  --warn:#F0A060; --warn-soft:#3A2A1C; --bad:#F08A80; --bad-soft:#3A1F1D; --info:#8CC3DE; --info-soft:#1C2E38;
  --side:#0A1612; --side-ink:#C9DCD2; --wa:#1F7A4D; --bar2:#6F7F78; --shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A16; --surface:#16241F; --surface-2:#1B2C26; --line:#2A3D35;
  --ink:#E6F0EA; --muted:#A3B8AE; --brand:#4FB287; --brand-ink:#0B1F17; --lime:#9BD458; --lime-soft:#22362A;
  --warn:#F0A060; --warn-soft:#3A2A1C; --bad:#F08A80; --bad-soft:#3A1F1D; --info:#8CC3DE; --info-soft:#1C2E38;
  --side:#0A1612; --side-ink:#C9DCD2; --wa:#1F7A4D; --bar2:#6F7F78; --shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;min-height:100%}
.side{width:240px;flex:none;background:var(--side);color:var(--side-ink);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;background:#FFFFFF;border-radius:16px;padding:8px 10px;flex:none}
.brand img{height:42px;width:auto}
.brand b{color:#0E5A43;font-weight:900;font-size:15px;line-height:1.15}
.menu-btn{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h3{margin:10px 12px 4px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#A8D86A;font-weight:900}
.nav a{color:var(--side-ink);text-decoration:none;font-weight:800;font-size:14px;padding:8px 12px;border-radius:11px;display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:40px}
.nav a .l{display:flex;align-items:center;gap:10px}
.nav a svg{flex:none;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:var(--lime);color:#0B2A20}
.nav .cnt{background:#C4520F;color:#FFFFFF;font-size:12px;padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.theme{margin-top:auto;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:var(--side-ink);font-weight:800;cursor:pointer;min-height:44px;flex:none}
.theme:hover{background:rgba(255,255,255,.08)}
.side-foot{font-size:12px;color:#A8D86A;line-height:1.4;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);flex:none}
.main{flex:1;min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px clamp(16px,3vw,32px)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:28px;font-weight:900;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-weight:700;font-size:14px}
.main a:not(.btn):not(.pcard){color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;border:2px solid transparent;cursor:pointer;text-decoration:none;min-height:42px;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--wa);color:#FFFFFF}
.btn.line{background:transparent;border-color:var(--brand);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--bad);padding-inline:10px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.grid-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi p{margin:0;font-weight:700;color:var(--muted);font-size:14px}
.kpi b{display:block;font-size:30px;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.kpi b.sm{font-size:22px}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.kpi small{color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;margin-bottom:16px}
.cols .box{margin-bottom:0}
.box h2{margin:0 0 12px;font-size:19px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box h2 a{font-size:14px;font-weight:800}
.empty{margin:0;padding:20px;text-align:center;background:var(--surface-2);border-radius:14px;color:var(--muted);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface-2)}
.item .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 240px}
.av{width:44px;height:44px;border-radius:14px;background:var(--lime-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.t{font-weight:900}
.s,.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-warn,.p-Pendiente,.p-Amarilla,.p-Enviado,.p-Observación{background:var(--warn-soft);color:var(--warn)}
.p-ok,.p-Confirmado,.p-Verde,.p-Aprobado,.p-Pagada,.p-Estable{background:var(--lime-soft);color:var(--brand)}
.p-info,.p-Atendido,.p-Facturado,.p-Borrador,.p-Alta{background:var(--info-soft);color:var(--info)}
.p-bad,.p-Cancelado,.p-Roja,.p-Crítico{background:var(--bad-soft);color:var(--bad)}
.tag-ej{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:0;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* agenda */
.week{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:180px}
.day h3{margin:0 0 8px;font-size:14px;font-weight:900;display:flex;justify-content:space-between;gap:6px}
.day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day.fer{background:var(--bad-soft);border-color:transparent}
.day.fer h3{color:var(--bad)}
.ferlbl{font-size:12px;font-weight:900;color:var(--bad);margin:0 0 8px;display:flex;gap:6px;align-items:center}
.slot{border-radius:12px;padding:8px 10px;background:var(--surface-2);border-left:4px solid var(--lime);margin-bottom:8px;font-size:13px}
.slot b{display:block;font-size:14px}
.slot.Pendiente{border-left-color:#C4520F}
.slot.Cancelado{opacity:.55;text-decoration:line-through}
.slot.Atendido{border-left-color:var(--info)}
.slot .acts{margin-top:6px}
.grid-k.k7{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.slot.est{border-left-color:var(--info);background:var(--info-soft)}
.occ-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.occ{border-collapse:separate;border-spacing:0;min-width:980px;width:100%;font-size:12px}
.occ th,.occ td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.occ th{font-size:11px;letter-spacing:.5px;text-transform:none;color:var(--muted);background:var(--surface-2)}
.occ th.fer{color:var(--bad);background:var(--bad-soft)}
.occ th.today{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.occ .rowh{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:900;color:var(--ink);z-index:1}
.occ td.on{background:var(--lime-soft);color:var(--brand);font-weight:800;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.occ td.on.pend{background:var(--warn-soft);color:var(--warn)}
.occ td.full{color:var(--bad);font-weight:900}
.occ td.closed{color:var(--muted);background:var(--surface-2)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .wd{font-size:12px;font-weight:900;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:1px;padding:4px 0}
.mcell{min-height:92px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcell:hover{border-color:var(--brand)}
.mcell .d{font-weight:900;font-variant-numeric:tabular-nums}
.mcell.out{opacity:.4}
.mcell.today{box-shadow:inset 0 0 0 2px var(--brand)}
.mcell.fer{background:var(--bad-soft);border-color:transparent}
.mcell.fer .d,.mcell.fer .fn{color:var(--bad)}
.mcell.closed{background:var(--surface-2)}
.mcell .fn{font-size:11px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mcell .c{font-size:12px;font-weight:800;color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);font-weight:700;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* patients */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .2s ease,box-shadow .2s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard .row{display:flex;gap:12px;align-items:center}
.alerts{display:flex;flex-wrap:wrap;gap:6px}
.fhead{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin-bottom:14px}
.fhead .big{width:72px;height:72px;border-radius:22px;font-size:26px}
.fhead h1{margin:0;font-size:28px;font-weight:900}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:700;font-size:14px}
.alertbar{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:800;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.low td{background:var(--warn-soft)}
tfoot td{font-weight:900;border-bottom:0}
dl.kv{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
dl.kv dt{color:var(--muted);font-weight:700}
dl.kv dd{margin:0;font-weight:800}
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.rem + .rem{margin-top:10px}
.when{font-family:var(--f-mono);font-weight:700;font-size:13px;text-align:center;min-width:64px;padding:6px;border-radius:10px;background:var(--surface-2)}
.rem.vencido .when{background:var(--bad-soft);color:var(--bad)}
.rem.semana .when{background:var(--warn-soft);color:var(--warn)}
.sent{font-size:12px;font-weight:800;color:var(--brand)}
.grp{margin:18px 0 10px;font-size:15px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
/* hospital / triage */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hcard.Crítico{border-left:6px solid var(--bad)} .hcard.Observación{border-left:6px solid #C4520F} .hcard.Estable{border-left:6px solid var(--lime)}
.evo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
.evo li{font-size:13px;background:var(--surface-2);border-radius:10px;padding:6px 10px}
.evo time{font-family:var(--f-mono);font-weight:700;color:var(--muted);margin-right:6px}
.tri{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.tri + .tri{margin-top:10px}
.tri .dot{width:14px;height:14px;border-radius:50%}
.dot.Roja{background:#C62828}.dot.Amarilla{background:#E0A100}.dot.Verde{background:#6BAA2E}
/* money & charts */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bar .track{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.bar .fill.b2{background:var(--bar2)}
.vbars{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--line);padding-top:10px}
.vbars .col{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;position:relative;min-width:0}
.vbars .v{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.vbars .v.b2{background:var(--bar2)}
.vbars .col:hover .v{filter:brightness(1.15)}
.xl{display:flex;gap:2px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:700;min-width:0;overflow:hidden}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px;white-space:nowrap}
.itemsed{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 70px 120px auto;gap:6px;align-items:end}
.irow input,.irow select{padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);min-height:42px;width:100%}
.totline{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding-top:10px;border-top:2px solid var(--line);margin-top:6px}
/* modal & forms */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,25,18,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 16px;font-size:22px;font-weight:900}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lbl{font-weight:800;font-size:13px}
.fld input,.fld select,.fld textarea{padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);min-height:46px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.sheet-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-weight:800;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow)}
.loading{padding:40px;text-align:center;color:var(--muted);font-weight:800}
/* date picker */
.dpbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);min-height:46px;cursor:pointer;font-weight:700}
.dpbtn:hover{border-color:var(--brand)}
.dpbtn svg{flex:none;color:var(--brand)}
.dpbtn .ph{color:var(--muted);font-weight:600}
.dpbtn .fx{margin-left:auto;font-size:11px;font-weight:900;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 8px}
.dp{position:fixed;z-index:70;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:14px}
.dp-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dp-h select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;min-height:38px}
.dp-nav{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-g .wd{font-size:11px;font-weight:900;color:var(--muted);text-align:center;padding:2px 0}
.dp-d{height:38px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums;position:relative}
.dp-d:hover:not(:disabled){background:var(--lime-soft)}
.dp-d.today{box-shadow:inset 0 0 0 2px var(--brand)}
.dp-d.sel{background:var(--brand);color:var(--brand-ink)}
.dp-d.fer{color:var(--bad);background:var(--bad-soft)}
.dp-d.fer::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--bad)}
.dp-d.sel.fer{background:var(--bad);color:#FFFFFF}
.dp-d.sun{color:var(--muted)}
.dp-d:disabled{cursor:not-allowed;opacity:.35;text-decoration:line-through}
.dp-d.fer:disabled{opacity:.75}
.dp-f{margin-top:10px;font-size:12px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.dp-f b{color:var(--bad)}
.dp-acts{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
/* print */

/* ================= hotel & guardería ================= */

const CUPO_G = 15;
const estActive = e => e.estado !== 'Cancelada' && e.estado !== 'Finalizada';

  if (a === 'urg-int') { const u = D.urgencias.filter(x => x.id === id)[0]; return formInt(u.pacienteId, u); }
  if (a === 'pres-sent') { const p = D.presupuestos.filter(x => x.id === id)[0]; if (p && p.estado === 'Borrador') upd('presupuestos', id, { estado: 'Enviado' }).catch(fail); return; }
  if (a === 'pres-ok') return upd('presupuestos', id, { estado: 'Aprobado' }).then(() => toast('Presupuesto aprobado.')).catch(fail);
  if (a === 'cobrar') { const f = D.facturas.filter(x => x.id === id)[0]; if (!f) return; return Promise.all([upd('facturas', id, { estado: 'Pagada', medio: 'Efectivo' }), cajaAdd({ tipo: 'Ingreso', concepto: 'Cobro factura ' + f.numero + ' · ' + f.cliente, medio: 'Efectivo', monto: itemsTotal(f.items) })]).then(() => toast('Cobro de ' + gs(itemsTotal(f.items)) + ' registrado en la caja de hoy.')).catch(fail); }
  if (a === 'del-fer') return del('feriados', id).then(() => toast('Cierre quitado.')).catch(fail);
});

(function init() {
  const c = window.claude;
  const off = () => { $('view').innerHTML = '<p class="loading">Este sistema necesita abrirse desde claude.ai para guardar y leer los datos.</p>'; };
  if (!c || !c.use) return off();
  c.use('db').then(d => {
    if (!d) return off();
    db = d;
    COLS.forEach(col => db.collection(col).onSnapshot(s => {
      D[col] = s.docs.map(x => { const o = Object.assign({}, x.data(), { id: x.id }); if (col === 'pacientes') o.tutor = o.tutor || {}; return o; });
      ready[col] = true; render();
    }, off));
  }).catch(off);
})();
</script>
